  db:
    image: postgres:15
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_v15:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookstore
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data_v15:
